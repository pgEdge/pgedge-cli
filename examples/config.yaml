# Example pgedge CLI configuration.
# Copy to ~/.pgedge/cli/config.yaml (mode 0600).

current_profile: default
profiles:
  default:
    starfleet:
      api_url: https://api.pgedge.com   # optional override
      client_id: xxxx
      client_secret: xxxx
      # `starfleet:` is the only name for this section: one product,
      # one credential. The byoc and managed command groups read it
      # too — they have no credential section of their own.
  staging:
    controlplane:
      base_url: https://cp.staging.internal:8443
output:
  format: text                # user default for -o
