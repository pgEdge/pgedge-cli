name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Keyless cosign signing and build-provenance attestations both
  # mint short-lived OIDC tokens; no long-lived signing key is stored.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # GoReleaser's `sboms:` stanza shells out to syft to catalog each
      # archive; without this the release step fails looking for it.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # Load per-module versions so GoReleaser's ldflags templates can
      # resolve {{ .Env.STARFLEET_VERSION }} / {{ .Env.CONTROLPLANE_VERSION }}. Only
      # KEY=VALUE lines are forwarded (comments/blanks are skipped).
      - name: Load per-module versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional PAT with write access to pgEdge/homebrew-tap. When
          # unset the cask is built but not published (see .goreleaser).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      # Dormant until the NPM_PUBLISH repository variable is "true".
      # Trusted publishing needs no token; NPM_TOKEN covers the first
      # publish, before a package exists to attach a trusted publisher to.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: vars.NPM_PUBLISH == 'true'
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Platform packages go first so @pgedge/cli never names a
        # version that is not there yet. A re-run skips what landed.
        run: |
          go run ./cmd/npmpack -dist dist -out dist/npm
          tag=$(cat dist/npm/dist-tag)
          for dir in dist/npm/cli-* dist/npm/cli; do
            spec=$(jq -r '.name + "@" + .version' "$dir/package.json")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
              continue
            fi
            npm publish "$dir" --access public --tag "$tag" --provenance
          done
