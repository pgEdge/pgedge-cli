language: en-US
reviews:
  auto_review:
    enabled: true
    drafts: false
  # Generated clients and vendored specs: `make generate` and
  # `make vendor-spec` own them, so a hand edit is never the fix.
  path_filters:
    - "!internal/**/api/client.gen.go"
    - "!openapi/account.yaml"
    - "!openapi/byoc.yaml"
    - "!openapi/managed.yaml"
    - "!openapi/control-plane.json"
  tools:
    golangci-lint:
      enabled: true
    gitleaks:
      enabled: true
