            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authorization information is missing or invalid.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error.
      security:
        - AccessToken: []
