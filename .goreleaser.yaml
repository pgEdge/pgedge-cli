version: 2
project_name: pgedge
before:
  hooks:
    - mkdir -p completions
    - sh -c 'go run ./cmd/pgedge completion bash > completions/pgedge.bash'
    - sh -c 'go run ./cmd/pgedge completion zsh  > completions/pgedge.zsh'
    - sh -c 'go run ./cmd/pgedge completion fish > completions/pgedge.fish'
    - sh -c 'go run ./cmd/pgedge completion powershell > completions/pgedge.ps1'
builds:
  - main: ./cmd/pgedge
    binary: pgedge
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/pgEdge/pgedge-cli/internal/cli.Version={{.Version}}
      - -X github.com/pgEdge/pgedge-cli/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/pgEdge/pgedge-cli/internal/cli.BuildDate={{.Date}}
      # Per-module versions come from versions.env (loaded into the
      # environment by the release workflow), NOT the release tag, so
      # each module moves on its own cadence.
      - -X github.com/pgEdge/pgedge-cli/internal/starfleet.Version={{ .Env.STARFLEET_VERSION }}
      - -X github.com/pgEdge/pgedge-cli/internal/controlplane.Version={{ .Env.CONTROLPLANE_VERSION }}
archives:
  - formats: [tar.gz]
    files:
      - completions/*
      - LICENSE.md
      - NOTICE.txt
      - THIRD_PARTY_LICENSES.txt
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
# SBOM (Software Bill of Materials) per archive, generated by syft
# (CI installs it; see release.yml). `id` is just a label — `archive`
# would misleadingly read as the selector; the actual selector is the
# explicit `artifacts: archive` below.
sboms:
  - id: default
    artifacts: archive
# Sign the checksum file with cosign (keyless / Sigstore). CI installs
# cosign and runs with `id-token: write`, so no long-lived key is
# stored. install.sh verifies this signature when cosign is present.
signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - --yes
    artifacts: checksum
    output: true
# Homebrew cask pushed to the pgEdge/homebrew-tap repo. Dormant until
# HOMEBREW_TAP_TOKEN (a PAT with write access to the tap) is set in the
# release environment; without it the cask is generated but not
# published, so releases never fail on a missing tap.
homebrew_casks:
  - repository:
      owner: pgEdge
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    homepage: https://github.com/pgEdge/pgedge-cli
    description: Unified CLI for the pgEdge product suite
    completions:
      bash: completions/pgedge.bash
      zsh: completions/pgedge.zsh
      fish: completions/pgedge.fish
    # The macOS binary is not notarized, so without this macOS refuses
    # a brew-installed pgedge as "damaged and cannot be opened".
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pgedge"]
          end
# Tags with a pre-release suffix (v0.2.0-alpha.1) publish as GitHub
# Pre-releases automatically. Without this the first alpha published
# as a full release and had to be demoted by hand (2026-08-06) — and
# a full release also claims the releases/latest slot, which the
# getting-started doc promises stays empty until a real release.
release:
  prerelease: auto

changelog:
  use: github
  filters:
    exclude: ["^chore:", "^docs:"]
