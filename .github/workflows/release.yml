name: Release

on:
  push:
    tags:
      - 'v*'
  # Publishes an already-released tag to npm, for a release cut before
  # npm publishing was switched on or whose npm job failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to npm, such as v0.5.0-beta.2
        required: true

permissions:
  contents: write
  # Keyless cosign signing and build-provenance attestations both
  # mint short-lived OIDC tokens; no long-lived signing key is stored.
  id-token: write
  attestations: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # GoReleaser's `sboms:` stanza shells out to syft to catalog each
      # archive; without this the release step fails looking for it.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # Load per-module versions so GoReleaser's ldflags templates can
      # resolve {{ .Env.STARFLEET_VERSION }} / {{ .Env.CONTROLPLANE_VERSION }}. Only
      # KEY=VALUE lines are forwarded (comments/blanks are skipped).
      - name: Load per-module versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional PAT with write access to pgEdge/homebrew-tap. When
          # unset the cask is built but not published (see .goreleaser).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Dormant until the NPM_PUBLISH repository variable is "true". It
  # publishes the signed archives the release uploaded, so a tag push
  # and a manual run publish the same bytes the same way. Trusted
  # publishing names this workflow file, which is why the manual run
  # lives here and not in a workflow of its own.
  npm:
    needs: release
    if: >-
      !cancelled() && vars.NPM_PUBLISH == 'true' &&
      (needs.release.result == 'success' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve the tag
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          # [[ =~ ]] matches the whole value; grep would pass a value
          # with a newline, which then writes a second line to GITHUB_ENV.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not a release tag"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The identity is install.sh's: only a tag run of release.yml
        # signs a checksums.txt this accepts. npmpack then checks each
        # archive against it.
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern 'pgedge_*.tar.gz' --pattern 'pgedge_*.zip' \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json
          cosign verify-blob \
            --bundle assets/checksums.txt.sigstore.json \
            --certificate-identity-regexp \
              "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            assets/checksums.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # No registry-url: its _authToken line, even empty, stops npm
        # trying trusted publishing.
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Trusted publishing needs no token; NPM_TOKEN covers the first
        # publish, before a package exists to attach a trusted publisher
        # to. Platform packages go first so @pgedge/cli never names a
        # version that is not there yet. A re-run skips what landed.
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          go run ./cmd/npmpack -assets assets -version "${TAG#v}" -out npm
          tag=$(cat npm/dist-tag)
          for dir in npm/cli-* npm/cli; do
            spec=$(jq -r '.name + "@" + .version' "$dir/package.json")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
              continue
            fi
            npm publish "$dir" --access public --tag "$tag" --provenance
          done
