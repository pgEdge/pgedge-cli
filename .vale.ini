StylesPath = styles
MinAlertLevel = error

# Vale globs key off file extension. Go doc comments and the
# extensionless llms.txt reference files are both prose we want
# linted, so both are mapped onto Vale's built-in Markdown handling:
# `go` uses Vale's tree-sitter Go-comment extractor (only // and /*
# */ comments are scanned — string literals, including Cobra's
# Short/Long fields and test fixtures, are never touched), and `txt`
# is treated as plain Markdown so llms.txt's backtick/table syntax
# parses the same way it does in every other reference doc.
[formats]
go = md
txt = md

# Generated reference blocks (machine output between <!-- BEGIN
# GENERATED --> / <!-- END GENERATED -->; `make docs` overwrites them)
# and doc-gate lines (the repo's deliberately-wrong-phrase convention
# for conformance tests) are NOT excluded here via BlockIgnores /
# TokenIgnores. Verified empirically (see scripts/lint-docs.sh's
# header comment and the PR description's positive-control evidence):
# both directives only ever match within a single Markdown block, and
# a generated block always mixes headings, tables and code fences —
# several blocks — while a real doc-gate marker often sits inside a
# table cell, itself a sub-block Vale scans on its own. A regex that
# spans BEGIN...END or `^...doc-gate:...$` therefore silently fails to
# match the exact cases that matter. `make lint-docs` instead runs
# scripts/lint-docs.sh, which blanks both kinds of region out of a
# throwaway copy before Vale ever parses it — line-based, so it works
# regardless of block structure, and preserves line numbers so a real
# violation still reports its true position.
#
# "PostgreSQL License" (LICENSE.md, CONTRIBUTING.md,
# REPO_READY_AUDIT.md) is the upstream license's real, published name
# — not a prose mention of the database — so it is carved out of the
# PostgreSQL->Postgres substitution by name rather than rewritten.
# Unlike the cases above this sits in a heading/short line Vale treats
# as one block, so TokenIgnores works and is verified directly.
[*.md]
BasedOnStyles = PgEdge
TokenIgnores = (PostgreSQL License)

[*.txt]
BasedOnStyles = PgEdge
TokenIgnores = (PostgreSQL License)

[*.go]
BasedOnStyles = PgEdge
# SourceSilence governs consumer prose, where "the API publishes no X"
# is the writer's research showing through. A code comment recording
# what a spec leaves unbounded is why the code does what it does, which
# is the one thing a comment is for.
PgEdge.SourceSilence = NO

# Release notes, generated from the commit history and never
# hand-edited, so a phrase in one is fixed at the commit it came from.
[docs/changelog.md]
PgEdge.SourceSilence = NO

# go-licenses output: a machine-generated CSV-shaped report, not
# prose. Regenerated by `make notice`; never hand-edited.
[NOTICE.txt]
BasedOnStyles =

# Generated API clients (`internal/**/api/**`) are produced by
# oapi-codegen from the vendored OpenAPI specs and are never
# hand-edited — see CONTRIBUTING.md's "OpenAPI specs and generated
# clients" section. Declared last so it wins: Vale's section-matching
# takes the last section whose glob matches a given file, so an
# earlier `[*.go]` match is overridden here for anything under an
# `api/` directory. The glob is `internal/**/api/**/*.go`, not
# `internal/*/api/**/*.go`: the cloud module nests its API packages
# one level deeper (`internal/starfleet/byoc/api`,
# `internal/starfleet/account/api`, `internal/starfleet/managed/api`) than
# controlplane's (`internal/controlplane/api`), and a single `*` only matches the
# shallower shape.
[internal/**/api/**/*.go]
BasedOnStyles =
