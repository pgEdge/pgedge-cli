name: sigprobe (temporary, delete before merge)

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        run: |
          cosign version
          printf '%s  %s\n' 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef pgedge_0.0.0_linux_amd64.tar.gz > checksums.txt
          cosign sign-blob --bundle=checksums.txt.sigstore.json checksums.txt --yes
      - name: verify as install.sh will
        run: |
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/pgEdge/pgedge-cli/\.github/workflows/sigprobe\.yml@refs/pull/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sigprobe
          path: |
            checksums.txt
            checksums.txt.sigstore.json
