repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet
  # Keep in step with .golangci-version, which CI reads. This hook
  # builds its own golangci-lint from `rev`, ignoring whatever is on
  # PATH, so it is a third record of the version and drifts silently:
  # CONTRIBUTING tells every contributor to install these hooks, so a
  # stale one lints their commit with a different linter than CI uses.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
